name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions: { contents: read }
concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.21.0", cache: npm }
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: npm run test:e2e
      - name: Browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-test-results
          path: /tmp/wme-e2e-evidence/
          retention-days: 7
  container-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24.21.0", cache: npm }
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - name: Native protocols and kernel isolation
        env:
          { WME_RUN_CONTAINER_ACCEPTANCE: "1", WME_INSTALL_TEST_PROFILES: "1" }
        run: bash platform/runtime/check-container.sh
      - name: Build API and runtime supervisor
        run: |
          docker build -t wme-platform:ci .
          docker build --target supervisor -t wme-supervisor:ci .
