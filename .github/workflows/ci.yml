name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions: { contents: read }
concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: "24.22.1", cache: npm }
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: npm run test:e2e
      - name: Browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-test-results
          path: /tmp/wme-e2e-evidence/
          retention-days: 7
  container-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: "24.22.1", cache: npm }
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - name: Native protocols and kernel isolation
        env:
          { WME_RUN_CONTAINER_ACCEPTANCE: "1", WME_INSTALL_TEST_PROFILES: "1" }
        run: bash platform/runtime/check-container.sh
      - name: Build API and runtime supervisor
        run: |
          docker build -t wme-platform:ci .
          docker build --target supervisor -t wme-supervisor:ci .
  inference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build patched inference service and test synthetic provider transports
        run: |
          docker build -f platform/deploy/Dockerfile.inference --target build -t wme-inference-build:ci .
          docker build -f platform/deploy/Dockerfile.inference -t wme-inference:ci .
      - name: Check reachable Go vulnerabilities
        run: docker run --rm --entrypoint /bin/sh wme-inference-build:ci -c 'go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...'
